name: Update Profile Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download latest stat SVGs
        run: |
          curl -fsSL "https://github-stats-alpha.vercel.app/api?username=Yohannes-Asfaw&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=percentile" -o assets/github-stats.svg
          curl -fsSL "https://github-readme-streak-stats.herokuapp.com/?user=Yohannes-Asfaw&theme=tokyonight&hide_border=true" -o assets/github-streak.svg
          curl -fsSL "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api/top-langs/?username=Yohannes-Asfaw&theme=tokyonight&hide_border=true&layout=compact&langs_count=8" -o assets/top-langs.svg

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-streak.svg assets/top-langs.svg
          git diff --staged --quiet || git commit -m "chore: update profile stats"
          git push
